<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R's /place</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        #canvas {
        display: grid;
        grid-template-columns: repeat(32, 20px); /* 32 Spalten, jede 20px breit */
        gap: 0;
        margin: 20px auto;
        width: fit-content;
        border: 1px solid #000; /* Optional: Rahmen um das Canvas */
    }
        .pixel {
            width: 20px;
            height: 20px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        #color-palette {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin: 20px 0;
        }
        .color-option {
            width: 30px;
            height: 30px;
            border: 2px solid #000;
            cursor: pointer;
        }
        .selected {
            border-color: red;
        }
    </style>
</head>
<body>
    <h1>R's /place</h1>
    <p>Klicke auf einen Pixel, um ihn zu ändern!</p>
    <p>Das Ganze ist als Pixel-Art gedacht, nicht als Malfläche</p>

    <!-- Farbrad und Hex-Anzeige -->
    <div style="margin: 20px 0;">
        <input type="color" id="color-picker" value="#ff0000" style="width: 50px; height: 50px;">
        <span id="color-hex" style="margin-left: 10px; font-family: monospace;">#FF0000</span>
    </div>

    <!-- Farbpalette (nur ein Element!) -->
    <div id="color-palette"></div>

    <!-- Canvas für die Pixel -->
    <div id="canvas"></div>

    <script src="script.js"></script>

    <!--<button id="preload-button">reset</button>-->
</body>
</html>
